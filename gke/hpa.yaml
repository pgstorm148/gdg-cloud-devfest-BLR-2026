# Scale on the model server's queue, not on CPU.
# Needs the Custom Metrics Stackdriver Adapter installed in the cluster
# (see the GKE "Configure autoscaling for LLM workloads on GPUs" guide).
# Confirm the metric exists in Metrics Explorer before relying on it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-gemma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-gemma
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Pods
    pods:
      metric:
        name: prometheus.googleapis.com|vllm:num_requests_waiting|gauge
      target:
        type: AverageValue
        averageValue: "4"        # GKE guidance: start at 3-5, then tune against latency
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300   # GPU pods are slow to start; don't flap
